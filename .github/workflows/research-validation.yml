name: Research Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install runner test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate research records and runs
        run: python scripts/validate_research_repo.py
      - name: Validate non-evidentiary runner fixtures
        run: python scripts/validate_runs.py
      - name: Run runner tests
        run: python -m pytest -q

  change-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Use ledger checker from main (a PR cannot grade its own diff with a weakened copy)
        run: |
          if git cat-file -e origin/main:scripts/validate_change_ledger.py 2>/dev/null; then
            git show origin/main:scripts/validate_change_ledger.py > scripts/validate_change_ledger.py
          fi
      - name: Validate change ledger
        run: python scripts/validate_change_ledger.py
